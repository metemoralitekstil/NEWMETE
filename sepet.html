    <script>
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const summary = document.querySelector('.cart-summary');
            const totalQtyEl = document.getElementById('cart-total-qty');
            
            const lang = (window.i18n && window.i18n.currentLang) || (new URLSearchParams(window.location.search).get('lang')) || localStorage.getItem('metemorali_lang') || 'tr';
            const t = (key, defaultText = '') => {
                if (window.i18n && typeof window.i18n.t === 'function') {
                    return window.i18n.t(key, defaultText);
                }
                if (window.i18n && window.i18n.translations && window.i18n.translations[lang]) {
                    return window.i18n.translations[lang][key] || defaultText;
                }
                return defaultText;
            };

            if (cart.length === 0) {
                summary.style.display = 'none';
                container.style.flex = '1';
                container.style.maxWidth = '100%';
                
                container.innerHTML = `
                    <div class="empty-cart-view">
                        <div class="empty-icon-wrapper">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <h2>${t('empty_cart_title', 'Sipariş Listeniz Şu An Boş')}</h2>
                        <p>${t('empty_cart_desc', 'Endüstriyel iş kıyafetlerini incelemek ve sepete eklemek için kataloğumuza göz atın.')}</p>
                        <a href="anasayfa" class="explore-btn">
                            <span>${t('explore_collection', 'Koleksiyonu Keşfet')}</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                `;
                totalQtyEl.textContent = `0 ${t('cart_qty_suffix', 'Adet')}`;
                return;
            }
            
            summary.style.display = 'block';
            container.style.flex = '2';
            
            let html = '';
            let totalQty = 0;
            let totalPrice = 0;
            
            cart.forEach((item, index) => {
                // HOTFIX: Auto-correct old broken image links saved in localStorage
                if (item.image && item.image.includes('Mavi-Sari.png')) {
                    item.image = item.image.replace('Mavi-Sari.png', 'Mavi_sari.png');
                    saveCart(); // Kalıcı olarak düzelt
                }
                if (item.image && item.image.includes('Sari-Mavi.png')) {
                    item.image = item.image.replace('Sari-Mavi.png', 'Coksari_mavi.png');
                    saveCart(); // Kalıcı olarak düzelt
                }

                const itemPrice = item.price || 100;
                totalQty += item.quantity;
                totalPrice += (item.quantity * itemPrice);
                
                html += `
                    <div class="cart-item">
                        <div class="cart-item-img">
                            <img loading="lazy" src="${item.image}" onerror="this.onerror=null;this.src='img/Beyaz Zeminde Yüksek Görünürlüklü İş Parkası.png'" alt="${typeof item.title === 'object' ? (item.title[lang] || item.title['tr']) : item.title}">
                        </div>
                        <div class="cart-item-details">
                            <h3>${typeof item.title === 'object' ? (item.title[lang] || item.title['tr']) : item.title}</h3>
                            <p class="item-size">${t('cart_item_size', 'Beden')}: <b>${item.size}</b></p>
                            <p class="item-price">€${itemPrice.toFixed(2)}</p>
                        </div>
                        <div class="cart-item-actions">
                            <div class="quantity-selector">
                                <button class="qty-btn" onclick="updateQuantity(${index}, -1)"><i class="fa-solid fa-minus"></i></button>
                                <input type="text" class="qty-input" value="${item.quantity}" readonly>
                                <button class="qty-btn" onclick="updateQuantity(${index}, 1)"><i class="fa-solid fa-plus"></i></button>
                            </div>
                            <div class="item-total-price">
                                €${(item.quantity * itemPrice).toFixed(2)}
                            </div>
                            <button class="remove-item-btn" onclick="removeFromCart(${index})"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            totalQtyEl.textContent = `${totalQty} ${t('cart_qty_suffix', 'Adet')}`;
            
            let totalEl = document.getElementById('cart-total-price');
            const totalText = t('total_price', 'Toplam Tutar');
            if (!totalEl) {
                const btn = document.querySelector('.checkout-btn');
                const priceHtml = `
                    <div class="summary-line total-price-line" style="border-top: 2px solid #eee; padding-top: 1.5rem; margin-top: 1rem; font-size: 1.3rem;">
                        <span>${totalText}:</span>
                        <span id="cart-total-price">€${totalPrice.toFixed(2)}</span>
                    </div>
                `;
                btn.insertAdjacentHTML('beforebegin', priceHtml);
            } else {
                totalEl.textContent = '€' + totalPrice.toFixed(2);
                const parentSpan = totalEl.previousElementSibling;
                if (parentSpan) parentSpan.textContent = `${totalText}:`;
            }
            
            const checkoutBtn = document.querySelector('.checkout-btn');
            if (checkoutBtn) {
                checkoutBtn.className = 'checkout-btn whatsapp-checkout-btn';
                checkoutBtn.innerHTML = `<i class="fa-brands fa-whatsapp"></i> <span>${t('whatsapp_order', 'WHATSAPP İLE SİPARİŞ VER')}</span>`;
                
                // Önceki listener'ı temizle (re-render'da çift eklemeyi önle)
                const newBtn = checkoutBtn.cloneNode(true);
                checkoutBtn.parentNode.replaceChild(newBtn, checkoutBtn);
                
                newBtn.addEventListener('click', handleWhatsAppOrder);
            }
        }
        
        async function handleWhatsAppOrder() {
            if (!cart || cart.length === 0) return;
            
            const lang = (window.i18n && window.i18n.currentLang) || (new URLSearchParams(window.location.search).get('lang')) || localStorage.getItem('metemorali_lang') || 'tr';
            const t = (key, defaultText = '') => {
                if (window.i18n && typeof window.i18n.t === 'function') {
                    return window.i18n.t(key, defaultText);
                }
                if (window.i18n && window.i18n.translations && window.i18n.translations[lang]) {
                    return window.i18n.translations[lang][key] || defaultText;
                }
                return defaultText;
            };

            // User details (if logged in)
            const userJson = localStorage.getItem('metemorali_user');
            const user = userJson ? JSON.parse(userJson) : null;
            const customerName = user ? (user.name || user.email || 'Kayıtlı Müşteri') : 'Web Ziyaretçisi';
            const customerPhone = user ? (user.type === 'phone' ? user.value : (user.phone || '')) : '';
            
            // Address (if available)
            const addresses = (user && user.addresses) || JSON.parse(localStorage.getItem('metemorali_addresses') || '[]');
            const primaryAddr = addresses.length > 0 ? addresses[0] : null;

            let totalPrice = 0;
            let totalQty = 0;
            let itemsText = '';

            cart.forEach(item => {
                const itemPrice = item.price || 100;
                const lineTotal = item.quantity * itemPrice;
                totalPrice += lineTotal;
                totalQty += item.quantity;
                const title = typeof item.title === 'object' ? (item.title[lang] || item.title['tr']) : item.title;
                itemsText += `• ${item.quantity}x ${title} (Beden: ${item.size || 'Standart'}) - €${lineTotal.toFixed(2)}\n`;
            });

            const orderNumber = 'MM-' + Math.floor(10000 + Math.random() * 90000);
            const dateStr = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

            let addressLine = '';
            if (primaryAddr) {
                const addrTitle = primaryAddr.title ? '[' + primaryAddr.title + '] ' : '';
                const addrStreet = primaryAddr.detail || primaryAddr.address || '';
                const addrLocation = [primaryAddr.district, primaryAddr.city].filter(Boolean).join(' / ');
                const addrZip = primaryAddr.zip ? ' (PK: ' + primaryAddr.zip + ')' : '';
                addressLine = `\n• *Teslimat Adresi:* ${addrTitle}${addrStreet} - ${addrLocation}${addrZip}`;
            }

            // Professional WhatsApp Order Message
            const message = 
`*METE MORALİ - YENİ SİPARİŞ / TEKLİF TALEBİ*
──────────────────────────
*Sipariş No:* #${orderNumber}
*Tarih:* ${dateStr}
*Müşteri:* ${customerName}${customerPhone ? ' (' + customerPhone + ')' : ''}${addressLine}

*Sipariş Edilen Ürünler:*
${itemsText}
*Toplam Adet:* ${totalQty} Adet
*Toplam Tutar:* €${totalPrice.toFixed(2)}
──────────────────────────
Sipariş detaylarını teyit etmek ve teslimat sürecini başlatmak istiyorum.`;

            const waNumber = (typeof SITE_CONFIG !== 'undefined' && SITE_CONFIG.whatsapp) ? SITE_CONFIG.whatsapp : '905322144553';
            const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;

            // 1. Immediately open WhatsApp in new tab / app
            const waTab = window.open(waUrl, '_blank');
            if (!waTab || waTab.closed || typeof waTab.closed === 'undefined') {
                window.location.href = waUrl;
            }

            // 2. Save order to customer local order history
            const localOrder = {
                id: orderNumber,
                date: dateStr,
                total: '€' + totalPrice.toFixed(2),
                status: 'Talep Alındı (WhatsApp)',
                items: cart.map(i => ({
                    title: typeof i.title === 'object' ? (i.title[lang] || i.title['tr']) : i.title,
                    size: i.size,
                    qty: i.quantity,
                    price: '€' + ((i.price || 100) * i.quantity).toFixed(2)
                }))
            };
            const localOrders = JSON.parse(localStorage.getItem('metemorali_orders')) || [];
            localOrders.unshift(localOrder);
            localStorage.setItem('metemorali_orders', JSON.stringify(localOrders));

            // 3. Log order to Supabase Orders & OrderItems asynchronously
            if (typeof supabaseClient !== 'undefined' && supabaseClient !== null) {
                try {
                    let namePayload = customerName;
                    if (primaryAddr) {
                        const addrTitle = primaryAddr.title ? '[' + primaryAddr.title + '] ' : '';
                        const addrStreet = primaryAddr.detail || primaryAddr.address || '';
                        const addrLocation = [primaryAddr.district, primaryAddr.city].filter(Boolean).join(' / ');
                        const addrZip = primaryAddr.zip ? ' (PK: ' + primaryAddr.zip + ')' : '';
                        namePayload = `${customerName} [Adres: ${addrTitle}${addrStreet} - ${addrLocation}${addrZip}]`;
                    }
                    const phonePayload = (customerPhone || 'WhatsApp').slice(0, 20);

                    const { data: orderData, error: orderErr } = await supabaseClient
                        .from('Orders')
                        .insert([{
                            CustomerName: namePayload,
                            CustomerPhone: phonePayload,
                            TotalAmount: totalPrice,
                            Status: 'Talep Alındı (WhatsApp)',
                            OrderDate: new Date().toISOString()
                        }])
                        .select()
                        .single();

                    if (!orderErr && orderData && orderData.Id) {
                        const itemsToInsert = cart.map(item => ({
                            OrderId: orderData.Id,
                            ProductId: item.id || 1,
                            Quantity: item.quantity,
                            UnitPrice: item.price || 100
                        }));
                        await supabaseClient.from('OrderItems').insert(itemsToInsert);
                    }
                } catch (dbErr) {
                    console.warn('Supabase sipariş kaydı arka planda tamamlanamadı:', dbErr);
                }
            }

            // 4. Clear cart & update UI
            localStorage.removeItem('metemorali_cart');
            cart = [];
            renderCart();

            if (window.showToast) {
                window.showToast('Sipariş talebiniz oluşturuldu, WhatsApp açılıyor...', 'success');
            }
        }
        
        document.addEventListener('DOMContentLoaded', renderCart);
    </script>

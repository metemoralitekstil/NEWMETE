    <!-- Kütüphaneler -->
    <script src="js/cart.js?v=3.2" defer></script>
    <script>
        function renderCart() {
            const container = document.getElementById('cart-items-container');
            const summary = document.querySelector('.cart-summary');
            const totalQtyEl = document.getElementById('cart-total-qty');
            
            const lang = (window.i18n && window.i18n.currentLang) || (new URLSearchParams(window.location.search).get('lang')) || localStorage.getItem('metemorali_lang') || 'tr';
            const t = (key, defaultText = '') => {
                if (window.i18n && typeof window.i18n.t === 'function') {
                    return window.i18n.t(key, defaultText);
                }
                if (window.i18n && window.i18n.translations && window.i18n.translations[lang]) {
                    return window.i18n.translations[lang][key] || defaultText;
                }
                return defaultText;
            };

            if (cart.length === 0) {
                summary.style.display = 'none';
                container.style.flex = '1';
                container.style.maxWidth = '100%';
                
                container.innerHTML = `
                    <div class="empty-cart-view">
                        <div class="empty-icon-wrapper">
                            <i class="fa-solid fa-box-open"></i>
                        </div>
                        <h2 data-i18n="empty_cart_title">${t('empty_cart_title', 'Sipariş Listeniz Şu An Boş')}</h2>
                        <p data-i18n="empty_cart_desc">${t('empty_cart_desc', 'Endüstriyel iş kıyafetlerini incelemek ve sepetinize eklemek için kataloğumuza göz atın.')}</p>
                        <a href="katalog.html" class="explore-btn">
                            <span data-i18n="explore_collection">${t('explore_collection', 'Koleksiyonu Keşfet')}</span>
                            <i class="fa-solid fa-arrow-right"></i>
                        </a>
                    </div>
                `;
                totalQtyEl.textContent = `0 ${t('cart_qty_suffix', 'Adet')}`;
                return;
            }
            
            summary.style.display = 'block';
            container.style.flex = '2';
            
            let html = '';
            let totalQty = 0;
            let totalPrice = 0;
            
            cart.forEach((item, index) => {
                // HOTFIX: Auto-correct old broken image links saved in localStorage
                if (item.image && item.image.includes('Mavi-Sari.png')) {
                    item.image = item.image.replace('Mavi-Sari.png', 'Mavi_sari.png');
                    saveCart(); // Kalıcı olarak düzelt
                }
                if (item.image && item.image.includes('Sari-Mavi.png')) {
                    item.image = item.image.replace('Sari-Mavi.png', 'Coksari_mavi.png');
                    saveCart(); // Kalıcı olarak düzelt
                }

                const itemPrice = item.price || 100;
                totalQty += item.quantity;
                totalPrice += (item.quantity * itemPrice);
                
                html += `
                    <div class="cart-item">
                        <div class="cart-item-img">
                            <img loading="lazy" src="${item.image}" onerror="this.onerror=null;this.src='img/Beyaz Zeminde Yüksek Görünürlüklü İş Parkası.png'" alt="${typeof item.title === 'object' ? (item.title[lang] || item.title['tr']) : item.title}">
                        </div>
                        <div class="cart-item-details">
                            <h3>${typeof item.title === 'object' ? (item.title[lang] || item.title['tr']) : item.title}</h3>
                            <p class="item-size">${t('cart_item_size', 'Beden')}: <b>${item.size}</b></p>
                            <p class="item-price">€${itemPrice.toFixed(2)}</p>
                        </div>
                        <div class="cart-item-actions">
                            <div class="quantity-selector">
                                <button class="qty-btn" onclick="updateQuantity(${index}, -1)"><i class="fa-solid fa-minus"></i></button>
                                <input type="text" class="qty-input" value="${item.quantity}" readonly>
                                <button class="qty-btn" onclick="updateQuantity(${index}, 1)"><i class="fa-solid fa-plus"></i></button>
                            </div>
                            <div class="item-total-price">
                                €${(item.quantity * itemPrice).toFixed(2)}
                            </div>
                            <button class="remove-item-btn" onclick="removeFromCart(${index})"><i class="fa-solid fa-trash-can"></i></button>
                        </div>
                    </div>
                `;
            });
            
            container.innerHTML = html;
            totalQtyEl.textContent = `${totalQty} ${t('cart_qty_suffix', 'Adet')}`;
            
            let totalEl = document.getElementById('cart-total-price');
            const totalText = t('total_price', 'Toplam Tutar');
            if (!totalEl) {
                const addrWrapper = document.getElementById('cart-delivery-address-container');
                const priceHtml = `
                    <div class="summary-line total-price-line" style="border-top: 2px solid #eee; padding-top: 1.5rem; margin-top: 1rem; font-size: 1.3rem;">
                        <span>${totalText}:</span>
                        <span id="cart-total-price">€${totalPrice.toFixed(2)}</span>
                    </div>
                `;
                if (addrWrapper) {
                    addrWrapper.insertAdjacentHTML('beforebegin', priceHtml);
                } else {
                    const btn = document.querySelector('.checkout-btn');
                    if (btn) btn.insertAdjacentHTML('beforebegin', priceHtml);
                }
            } else {
                totalEl.textContent = '€' + totalPrice.toFixed(2);
                const parentSpan = totalEl.previousElementSibling;
                if (parentSpan) parentSpan.textContent = `${totalText}:`;
            }

            renderDeliveryAddressSection();
            
            const checkoutBtn = document.querySelector('.checkout-btn');
            if (checkoutBtn) {
                checkoutBtn.className = 'checkout-btn whatsapp-checkout-btn';
                checkoutBtn.innerHTML = `<i class="fa-brands fa-whatsapp"></i> <span>${t('whatsapp_order', 'WHATSAPP İLE SİPARİŞ VER')}</span>`;
                
                // Önceki listener'ı temizle
                const newBtn = checkoutBtn.cloneNode(true);
                checkoutBtn.parentNode.replaceChild(newBtn, checkoutBtn);
                
                newBtn.addEventListener('click', handleWhatsAppOrder);
            }
        }

        // --- TESLİMAT ADRESİ FONKSİYONLARI ---
        function getCartAddresses() {
            let addrs = [];
            try {
                addrs = JSON.parse(localStorage.getItem('metemorali_addresses') || '[]');
            } catch (e) { addrs = []; }

            const user = JSON.parse(localStorage.getItem('metemorali_user') || 'null');
            if (user && Array.isArray(user.addresses) && user.addresses.length > 0) {
                if (addrs.length === 0) {
                    addrs = user.addresses;
                    localStorage.setItem('metemorali_addresses', JSON.stringify(addrs));
                }
            }
            return addrs;
        }

        function getSelectedAddressIndex() {
            const idx = parseInt(localStorage.getItem('metemorali_selected_address_idx') || '0', 10);
            return isNaN(idx) ? 0 : idx;
        }

        function detectUserCountry() {
            try {
                const tz = (Intl.DateTimeFormat().resolvedOptions().timeZone || '').toLowerCase();
                if (tz.includes('istanbul')) return 'Türkiye';
                if (tz.includes('berlin') || tz.includes('busingen')) return 'Almanya';
                if (tz.includes('amsterdam')) return 'Hollanda';
                if (tz.includes('paris')) return 'Fransa';
                if (tz.includes('london')) return 'Birleşik Krallık';
                if (tz.includes('rome')) return 'İtalya';
                if (tz.includes('madrid') || tz.includes('ceuta') || tz.includes('canary')) return 'İspanya';
                if (tz.includes('brussels')) return 'Belçika';
                if (tz.includes('vienna')) return 'Avusturya';
                if (tz.includes('zurich')) return 'İsviçre';
                if (tz.includes('warsaw')) return 'Polonya';
                if (tz.includes('bucharest')) return 'Romanya';
                if (tz.includes('sofia')) return 'Bulgaristan';
                if (tz.includes('athens')) return 'Yunanistan';
                if (tz.includes('stockholm')) return 'İsveç';
                if (tz.includes('oslo')) return 'Norveç';
                if (tz.includes('copenhagen')) return 'Danimarka';
                if (tz.includes('helsinki')) return 'Finlandiya';
                if (tz.includes('lisbon')) return 'Portekiz';
                if (tz.includes('dublin')) return 'İrlanda';
                if (tz.includes('prague')) return 'Çekya';
                if (tz.includes('budapest')) return 'Macaristan';
                if (tz.startsWith('america/')) {
                    if (tz.includes('toronto') || tz.includes('vancouver') || tz.includes('montreal')) return 'Kanada';
                    if (tz.includes('mexico')) return 'Meksika';
                    if (tz.includes('sao_paulo')) return 'Brezilya';
                    return 'Amerika Birleşik Devletleri';
                }
                if (tz.includes('baku')) return 'Azerbaycan';
                if (tz.includes('dubai')) return 'Birleşik Arap Emirlikleri';
                if (tz.includes('riyadh')) return 'Suudi Arabistan';
                if (tz.includes('qatar')) return 'Katar';
                if (tz.includes('almaty') || tz.includes('astana')) return 'Kazakistan';
                if (tz.includes('tashkent')) return 'Özbekistan';
                if (tz.includes('kuwait')) return 'Kuveyt';
                if (tz.includes('tbilisi')) return 'Gürcistan';
                if (tz.includes('moscow')) return 'Rusya';
                if (tz.includes('shanghai') || tz.includes('beijing')) return 'Çin';
                if (tz.includes('tokyo')) return 'Japonya';
                if (tz.includes('seoul')) return 'Güney Kore';
                if (tz.includes('singapore')) return 'Singapur';

                const navLang = (navigator.languages && navigator.languages[0]) || navigator.language || '';
                const region = (navLang.split('-')[1] || '').toUpperCase();
                const base = (navLang.split('-')[0] || '').toLowerCase();

                const regionMap = {
                    'TR': 'Türkiye', 'DE': 'Almanya', 'NL': 'Hollanda', 'FR': 'Fransa',
                    'GB': 'Birleşik Krallık', 'UK': 'Birleşik Krallık', 'IT': 'İtalya',
                    'ES': 'İspanya', 'BE': 'Belçika', 'AT': 'Avusturya', 'CH': 'İsviçre',
                    'PL': 'Polonya', 'US': 'Amerika Birleşik Devletleri', 'CA': 'Kanada',
                    'AZ': 'Azerbaycan', 'AE': 'Birleşik Arap Emirlikleri', 'SA': 'Suudi Arabistan',
                    'RU': 'Rusya', 'JP': 'Japonya', 'KR': 'Güney Kore', 'CN': 'Çin'
                };
                if (region && regionMap[region]) return regionMap[region];
                if (base === 'de') return 'Almanya';
                if (base === 'nl') return 'Hollanda';
                if (base === 'fr') return 'Fransa';
                if (base === 'it') return 'İtalya';
                if (base === 'es') return 'İspanya';
                if (base === 'ru') return 'Rusya';
                if (base === 'az') return 'Azerbaycan';
                if (base === 'tr') return 'Türkiye';
            } catch (e) {
                console.warn('Country detection error:', e);
            }
            return 'Türkiye';
        }

        function handleCountryChange(country, prefillCity = '') {
            const selectEl = document.getElementById('cart-addr-city-select');
            const inputEl = document.getElementById('cart-addr-city-input');
            const labelEl = document.getElementById('cart-city-label');
            const districtLabel = document.getElementById('cart-district-label');
            const districtInput = document.getElementById('cart-addr-district');

            if (!selectEl || !inputEl) return;

            if (country === 'Türkiye') {
                selectEl.style.display = 'block';
                selectEl.required = true;
                inputEl.style.display = 'none';
                inputEl.required = false;
                if (labelEl) labelEl.textContent = t('city_required', 'İl / Şehir *');
                if (districtLabel) districtLabel.textContent = t('district_required', 'İlçe *');
                if (districtInput) districtInput.placeholder = t('district_placeholder', 'Örn: Torbalı, Kadıköy, Çankaya');
                if (prefillCity) selectEl.value = prefillCity;
            } else {
                selectEl.style.display = 'none';
                selectEl.required = false;
                inputEl.style.display = 'block';
                inputEl.required = true;
                if (labelEl) labelEl.textContent = t('city_state_required', 'Şehir / Eyalet *');
                if (districtLabel) districtLabel.textContent = t('district_required', 'İlçe / Bölge *');
                if (districtInput) districtInput.placeholder = t('district_placeholder_intl', 'Örn: Bölge, Kasaba, City / State');
                if (prefillCity) inputEl.value = prefillCity;
            }
        }

        function openCartAddressModal(forceNewForm = false, editIndex = -1) {
            const modal = document.getElementById('cart-address-modal');
            if (!modal) return;

            const addrs = getCartAddresses();
            const savedSection = document.getElementById('modal-saved-addresses-section');
            const formSection = document.getElementById('modal-address-form-section');
            const savedList = document.getElementById('modal-saved-addresses-list');
            const formSubheading = document.getElementById('form-subheading');

            const user = JSON.parse(localStorage.getItem('metemorali_user') || 'null');
            const receiverInput = document.getElementById('cart-addr-receiver');
            const phoneInput = document.getElementById('cart-addr-phone');

            if (editIndex > -1 && addrs[editIndex]) {
                savedSection.style.display = 'none';
                formSection.style.display = 'block';
                if (formSubheading) formSubheading.textContent = t('edit_address', 'Adresi Düzenle');
                document.getElementById('cart-address-edit-idx').value = editIndex;

                const addr = addrs[editIndex];
                document.getElementById('cart-addr-title').value = addr.title || '';
                document.getElementById('cart-addr-receiver').value = addr.receiver || '';
                document.getElementById('cart-addr-phone').value = addr.phone || '';
                document.getElementById('cart-addr-district').value = addr.district || '';
                document.getElementById('cart-addr-detail').value = addr.detail || addr.address || '';
                document.getElementById('cart-addr-zip').value = addr.zip || '';

                const countryVal = addr.country || 'Türkiye';
                setupCountryDropdown(countryVal);
                handleCountryChange(countryVal, addr.city || '');
                setTimeout(() => autoGrowAddress(document.getElementById('cart-addr-detail')), 50);
            } else if (addrs.length > 0 && !forceNewForm) {
                savedSection.style.display = 'block';
                formSection.style.display = 'none';

                let selectedIdx = getSelectedAddressIndex();
                if (selectedIdx >= addrs.length) selectedIdx = 0;

                savedList.innerHTML = addrs.map((addr, idx) => `
                    <div class="modal-addr-card ${idx === selectedIdx ? 'selected' : ''}" onclick="selectCartAddress(${idx})">
                        <input type="radio" name="cart_selected_addr" class="modal-addr-radio" ${idx === selectedIdx ? 'checked' : ''}>
                        <div class="modal-addr-info">
                            <div class="modal-addr-top">
                                <span class="modal-addr-name">${addr.receiver || t('receiver_name_required', 'Alıcı')}</span>
                                <span class="modal-addr-tag">${addr.title || t('delivery_address', 'Adres')}</span>
                            </div>
                            <div>${addr.detail || addr.address || ''}</div>
                            <div style="font-weight: 600; color: #0f172a; margin-top: 2px;">
                                ${[addr.district, addr.city, addr.country || 'Türkiye'].filter(Boolean).join(' / ')} ${addr.phone ? '• ' + addr.phone : ''}
                            </div>
                        </div>
                    </div>
                `).join('');
            } else {
                savedSection.style.display = 'none';
                formSection.style.display = 'block';
                if (formSubheading) formSubheading.textContent = t('delivery_address_info_title', 'Teslimat Adresi Bilgileri');
                document.getElementById('cart-address-edit-idx').value = '-1';
                document.getElementById('cart-address-inner-form').reset();
                if (user) {
                    if (receiverInput) receiverInput.value = user.name || '';
                    if (phoneInput) phoneInput.value = user.phone || (user.type === 'phone' ? user.value : '');
                }
                const defaultCountry = detectUserCountry();
                setupCountryDropdown(defaultCountry);
                handleCountryChange(defaultCountry);
                setTimeout(() => autoGrowAddress(document.getElementById('cart-addr-detail')), 50);
            }

            // Modal içindeki tüm data-i18n etiketlerini aktif dilde güncelle
            if (window.i18n && typeof window.i18n.translateElement === 'function') {
                modal.querySelectorAll('[data-i18n]').forEach(el => window.i18n.translateElement(el));
            }

            modal.style.display = 'flex';
            setTimeout(() => modal.classList.add('active'), 10);
        }

        function closeCartAddressModal() {
            const modal = document.getElementById('cart-address-modal');
            if (!modal) return;
            modal.classList.remove('active');
            setTimeout(() => { modal.style.display = 'none'; }, 250);
        }

        function toggleCartAddressForm(showForm) {
            const modal = document.getElementById('cart-address-modal');
            const savedSection = document.getElementById('modal-saved-addresses-section');
            const formSection = document.getElementById('modal-address-form-section');
            const formSubheading = document.getElementById('form-subheading');

            if (showForm) {
                savedSection.style.display = 'none';
                formSection.style.display = 'block';
                if (formSubheading) formSubheading.textContent = t('add_new_delivery_address', 'Yeni Teslimat Adresi Ekle');
                document.getElementById('cart-address-edit-idx').value = '-1';
                document.getElementById('cart-address-inner-form').reset();
                const user = JSON.parse(localStorage.getItem('metemorali_user') || 'null');
                if (user) {
                    const receiverInput = document.getElementById('cart-addr-receiver');
                    const phoneInput = document.getElementById('cart-addr-phone');
                    if (receiverInput) receiverInput.value = user.name || '';
                    if (phoneInput) phoneInput.value = user.phone || (user.type === 'phone' ? user.value : '');
                }
                const defaultCountry = detectUserCountry();
                setupCountryDropdown(defaultCountry);
                handleCountryChange(defaultCountry);
                setTimeout(() => autoGrowAddress(document.getElementById('cart-addr-detail')), 50);

                if (modal && window.i18n && typeof window.i18n.translateElement === 'function') {
                    modal.querySelectorAll('[data-i18n]').forEach(el => window.i18n.translateElement(el));
                }
            } else {
                const addrs = getCartAddresses();
                if (addrs.length > 0) {
                    savedSection.style.display = 'block';
                    formSection.style.display = 'none';
                } else {
                    closeCartAddressModal();
                }
            }
        }

        function handleCancelAddressForm() {
            const addrs = getCartAddresses();
            if (addrs.length > 0) {
                toggleCartAddressForm(false);
            } else {
                closeCartAddressModal();
            }
        }

        function selectCartAddress(idx) {
            localStorage.setItem('metemorali_selected_address_idx', idx.toString());
            closeCartAddressModal();
            renderDeliveryAddressSection();
            if (window.showToast) {
                window.showToast('Teslimat adresi seçildi.', 'success');
            }
        }

        async function handleSaveCartAddress(e) {
            e.preventDefault();
            const title = document.getElementById('cart-addr-title').value.trim();
            const receiver = document.getElementById('cart-addr-receiver').value.trim();
            const phone = document.getElementById('cart-addr-phone').value.trim();
            const country = document.getElementById('cart-addr-country').value.trim() || 'Türkiye';
            
            let city = '';
            if (country === 'Türkiye') {
                const citySelect = document.getElementById('cart-addr-city-select');
                city = citySelect ? citySelect.value.trim() : '';
            } else {
                const cityInput = document.getElementById('cart-addr-city-input');
                city = cityInput ? cityInput.value.trim() : '';
            }

            const district = document.getElementById('cart-addr-district').value.trim();
            const detail = document.getElementById('cart-addr-detail').value.trim();
            const zip = document.getElementById('cart-addr-zip').value.trim();

            if (!title || !receiver || !phone || !country || !city || !district || !detail) {
                if (window.showToast) window.showToast('Lütfen tüm zorunlu adres alanlarını eksiksiz doldurun.', 'error');
                return;
            }

            const editIdx = parseInt(document.getElementById('cart-address-edit-idx').value, 10);
            let addrs = getCartAddresses();

            const newAddr = { title, receiver, phone, country, city, district, detail, zip };

            let targetIdx = 0;
            if (editIdx > -1 && editIdx < addrs.length) {
                addrs[editIdx] = newAddr;
                targetIdx = editIdx;
            } else {
                addrs.unshift(newAddr);
                targetIdx = 0;
            }

            localStorage.setItem('metemorali_addresses', JSON.stringify(addrs));
            localStorage.setItem('metemorali_selected_address_idx', targetIdx.toString());

            const user = JSON.parse(localStorage.getItem('metemorali_user') || 'null');
            if (user) {
                user.addresses = addrs;
                if (!user.phone) user.phone = phone;
                localStorage.setItem('metemorali_user', JSON.stringify(user));
            }

            const client = window.supabaseClient || (window.supabase ? window.supabase : null);
            if (client && client.auth) {
                try {
                    await client.auth.updateUser({
                        data: { addresses: addrs }
                    });
                } catch(err) {
                    console.warn('Supabase adres eşitleme uyarısı:', err);
                }
            }

            closeCartAddressModal();
            renderDeliveryAddressSection();
            if (window.showToast) {
                window.showToast('Teslimat adresiniz kaydedildi. Şimdi siparişinizi tamamlayabilirsiniz.', 'success');
            }
        }
        
        async function handleWhatsAppOrder() {
            if (!cart || cart.length === 0) return;
            
            const lang = (window.i18n && window.i18n.currentLang) || (new URLSearchParams(window.location.search).get('lang')) || localStorage.getItem('metemorali_lang') || 'tr';
            const t = (key, defaultText = '') => {
                if (window.i18n && typeof window.i18n.t === 'function') {
                    return window.i18n.t(key, defaultText);
                }
                if (window.i18n && window.i18n.translations && window.i18n.translations[lang]) {
                    return window.i18n.translations[lang][key] || defaultText;
                }
                return defaultText;
            };

            // 1. KESİN VE ZORUNLU TESLİMAT ADRESİ KONTROLÜ
            const addrs = getCartAddresses();
            let selectedIdx = getSelectedAddressIndex();
            if (selectedIdx >= addrs.length) selectedIdx = 0;
            const primaryAddr = addrs.length > 0 ? addrs[selectedIdx] : null;

            if (!primaryAddr || !primaryAddr.detail || !primaryAddr.city || !primaryAddr.receiver) {
                if (window.showToast) {
                    window.showToast('Sipariş verebilmek için lütfen önce teslimat adresinizi belirtin.', 'error');
                }
                const btn = document.querySelector('.checkout-btn');
                if (btn) {
                    btn.classList.add('shake-anim');
                    setTimeout(() => btn.classList.remove('shake-anim'), 500);
                }
                openCartAddressModal(true);
                return; // Adres olmadan sipariş ASLA verilemez
            }

            // Müşteri bilgileri
            const userJson = localStorage.getItem('metemorali_user');
            const user = userJson ? JSON.parse(userJson) : null;
            const customerName = primaryAddr.receiver || (user ? (user.name || user.email) : 'Değerli Müşterimiz');
            const customerPhone = primaryAddr.phone || (user ? (user.type === 'phone' ? user.value : (user.phone || '')) : '');
            
            let totalPrice = 0;
            let totalQty = 0;
            let itemsText = '';

            cart.forEach(item => {
                const itemPrice = item.price || 100;
                const lineTotal = item.quantity * itemPrice;
                totalPrice += lineTotal;
                totalQty += item.quantity;
                const title = typeof item.title === 'object' ? (item.title[lang] || item.title['tr']) : item.title;
                itemsText += `• ${item.quantity}x ${title} (Beden: ${item.size || 'Standart'}) - €${lineTotal.toFixed(2)}\n`;
            });

            const orderNumber = 'MM-' + Math.floor(10000 + Math.random() * 90000);
            const dateStr = new Date().toLocaleDateString('tr-TR', { day: 'numeric', month: 'long', year: 'numeric' });

            const addrTitle = primaryAddr.title ? `[${primaryAddr.title}] ` : '';
            const addrStreet = primaryAddr.detail || primaryAddr.address || '';
            const addrCountry = primaryAddr.country || 'Türkiye';
            const addrLocation = [primaryAddr.district, primaryAddr.city, addrCountry].filter(Boolean).join(' / ');
            const addrZip = primaryAddr.zip ? ` (PK: ${primaryAddr.zip})` : '';
            const addressLine = `\n• *Teslimat Adresi:* ${addrTitle}${addrStreet} - ${addrLocation}${addrZip}\n• *Teslim Alacak Kişi:* ${customerName}${customerPhone ? ' (' + customerPhone + ')' : ''}`;

            // Profesyonel WhatsApp Sipariş Mesajı
            const message = 
`*METE MORALİ - YENİ SİPARİŞ / TEKLİF TALEBİ*
──────────────────────────
*Sipariş No:* #${orderNumber}
*Tarih:* ${dateStr}
*Müşteri:* ${customerName}${customerPhone ? ' (' + customerPhone + ')' : ''}${addressLine}

*Sipariş Edilen Ürünler:*
${itemsText}
*Toplam Adet:* ${totalQty} Adet
*Toplam Tutar:* €${totalPrice.toFixed(2)}
──────────────────────────
Sipariş detaylarını teyit etmek ve teslimat sürecini başlatmak istiyorum.`;

            const waNumber = (typeof SITE_CONFIG !== 'undefined' && SITE_CONFIG.whatsapp) ? SITE_CONFIG.whatsapp : '905322144553';
            const waUrl = `https://wa.me/${waNumber}?text=${encodeURIComponent(message)}`;

            // 1. WhatsApp penceresini aç
            const waTab = window.open(waUrl, '_blank');
            if (!waTab || waTab.closed || typeof waTab.closed === 'undefined') {
                window.location.href = waUrl;
            }

            // 2. Siparişi yerel geçmişe kaydet
            const localOrder = {
                id: orderNumber,
                date: dateStr,
                total: '€' + totalPrice.toFixed(2),
                status: 'Talep Alındı (WhatsApp)',
                address: `${addrTitle}${addrStreet} - ${addrLocation}${addrZip}`,
                receiver: customerName,
                receiverPhone: customerPhone,
                items: cart.map(i => ({
                    title: typeof i.title === 'object' ? (i.title[lang] || i.title['tr']) : i.title,
                    size: i.size,
                    qty: i.quantity,
                    price: '€' + ((i.price || 100) * i.quantity).toFixed(2)
                }))
            };
            const localOrders = JSON.parse(localStorage.getItem('metemorali_orders')) || [];
            localOrders.unshift(localOrder);
            localStorage.setItem('metemorali_orders', JSON.stringify(localOrders));

            // 3. Supabase Orders & OrderItems tablosuna tam teslimat adresiyle kaydet
            if (typeof supabaseClient !== 'undefined' && supabaseClient !== null) {
                try {
                    const namePayload = `${customerName} [Adres: ${addrTitle}${addrStreet} - ${addrLocation}${addrZip} | Tel: ${customerPhone}]`;
                    const phonePayload = (customerPhone || 'WhatsApp').slice(0, 20);

                    const { data: orderData, error: orderErr } = await supabaseClient
                        .from('Orders')
                        .insert([{
                            CustomerName: namePayload,
                            CustomerPhone: phonePayload,
                            TotalAmount: totalPrice,
                            Status: 'Talep Alındı (WhatsApp)',
                            OrderDate: new Date().toISOString()
                        }])
                        .select()
                        .single();

                    if (!orderErr && orderData && orderData.Id) {
                        const itemsToInsert = cart.map(item => ({
                            OrderId: orderData.Id,
                            ProductId: item.id || 1,
                            Quantity: item.quantity,
                            UnitPrice: item.price || 100
                        }));
                        await supabaseClient.from('OrderItems').insert(itemsToInsert);
                    }
                } catch (dbErr) {
                    console.warn('Supabase sipariş kaydı arka planda tamamlanamadı:', dbErr);
                }
            }

            // 4. Sepeti temizle & Arayüzü yenile
            localStorage.removeItem('metemorali_cart');
            cart = [];
            renderCart();

            if (window.showToast) {
                window.showToast('Sipariş talebiniz oluşturuldu, WhatsApp açılıyor...', 'success');
            }
        }
        
        document.addEventListener('DOMContentLoaded', () => {
            renderCart();
        });
        document.addEventListener('componentsLoaded', () => {
            renderCart();
            // Supabase session'ından adresleri senkronize et
            const client = window.supabaseClient || (window.supabase ? window.supabase : null);
            if (client && client.auth) {
                client.auth.getSession().then(({ data: { session } }) => {
                    if (session && session.user && session.user.user_metadata && session.user.user_metadata.addresses) {
                        const addrs = session.user.user_metadata.addresses;
                        if (Array.isArray(addrs) && addrs.length > 0) {
                            localStorage.setItem('metemorali_addresses', JSON.stringify(addrs));
                            renderDeliveryAddressSection();
                        }
                    }
                }).catch(() => {});
            }
        });
    </script>

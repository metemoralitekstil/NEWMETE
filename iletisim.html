        <h1 class="sr-only" data-i18n="contact_title">İletişim - MeteMorali</h1>
        <!-- Üst Kısım Form (Sıfır Kutu, Alt Çizgili İnput) -->
        <div class="pure-form-section">
            <div class="pure-form-header">
                <h2 data-i18n="write_to_us">Bize Yazın</h2>
            </div>
            <form class="pure-form" id="contact-form">
                <div class="pure-form-row">
                    <input type="text" name="from_name" placeholder="Adınız Soyadınız" data-i18n="fullname" required>
                    <input type="email" name="from_email" placeholder="E-Posta Adresiniz" data-i18n="email_address" required>
                </div>
                <div class="pure-form-row">
                    <select name="subject" required>
                        <option value="" disabled selected data-i18n="select_subject">Konu Seçiniz</option>
                        <option value="genel" data-i18n="general_info">Genel Bilgi</option>
                        <option value="siparis" data-i18n="delivery">Sipariş & Teslimat</option>
                        <option value="bayilik" data-i18n="subject_dealership">Bayilik</option>
                    </select>
                </div>
                <div class="pure-form-row">
                    <label for="contact-message" class="sr-only" data-i18n="message">Mesajınız...</label>
                    <textarea id="contact-message" name="message" rows="1" placeholder="Mesajınız..." data-i18n="message" required oninput="this.style.height = '';this.style.height = this.scrollHeight + 'px'"></textarea>
                </div>
                <!-- KVKK Onay Checkbox -->
                <div class="pure-form-row kvkk-row" style="flex-direction: row; align-items: flex-start; gap: 12px; margin-top: 8px;">
                    <input type="checkbox" id="kvkk-consent" name="kvkk_consent" required
                           style="width: 18px; height: 18px; margin-top: 2px; flex-shrink: 0; cursor: pointer; accent-color: #111;">
                    <label for="kvkk-consent" style="font-size: 0.85rem; color: #555; line-height: 1.5; cursor: pointer;">
                        Kişisel verilerimin 
                        <a href="sozlesmeler#kvkk" target="_blank" style="color: #111; text-decoration: underline; font-weight: 600;">KVKK Aydınlatma Metni</a> 
                        kapsamında işlenmesini ve tarafıma iletişim kurulmasını onaylıyorum.
                    </label>
                </div>
                <button type="submit" class="pure-submit-btn" data-i18n="send_btn">Gönder</button>
            </form>
        </div>

        <div class="or-separator">
            <span data-i18n="or_separator">VEYA</span>
        </div>

    <script>
    document.getElementById('contact-form').addEventListener('submit', function(e) {
        e.preventDefault();
        
        const lang = (window.i18n && window.i18n.currentLang) || (new URLSearchParams(window.location.search).get('lang')) || localStorage.getItem('metemorali_lang') || 'tr';
        const t = (key, defaultText) => {
            if (window.i18n && typeof window.i18n.t === 'function') {
                return window.i18n.t(key, defaultText);
            }
            if (window.i18n && window.i18n.translations && window.i18n.translations[lang]) {
                return window.i18n.translations[lang][key] || defaultText;
            }
            return defaultText;
        };

        // Rate Limiting (Spam Koruması)
        const lastSentTime = localStorage.getItem('lastEmailSentTime');
        const now = new Date().getTime();
        // 60 saniye (60000 ms) cooldown
        if (lastSentTime && (now - lastSentTime < 60000)) {
            const msg = t('spam_protection', "Spam koruması: Lütfen yeni bir mesaj göndermeden önce 1 dakika bekleyin.");
            if (window.showToast) {
                window.showToast(msg, 'error');
            } else {
                alert(msg);
            }
            return;
        }
        
        const btn = this.querySelector('.pure-submit-btn');
        const originalText = btn.textContent;
        btn.textContent = t('sending', 'Gönderiliyor...');
        btn.disabled = true;
        
        emailjs.sendForm('service_lkiyi5e', 'template_jb0io0q', this)
            .then(function() {
                // Başarılı gönderim sonrası zamanı kaydet
                localStorage.setItem('lastEmailSentTime', now);
                
                btn.textContent = t('msg_sent', '✓ Mesajınız İletildi!');
                btn.style.background = '#27ae60';
                document.getElementById('contact-form').reset();
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                    btn.disabled = false;
                }, 4000);
            }, function(error) {
                btn.textContent = t('msg_error', 'Hata! Tekrar deneyin.');
                btn.style.background = '#e74c3c';
                btn.disabled = false;
                setTimeout(() => {
                    btn.textContent = originalText;
                    btn.style.background = '';
                }, 3000);
                console.error('EmailJS error:', error);
            });
    });
    </script>

    <script>
    (function() {
        var params = new URLSearchParams(window.location.search);
        var id = params.get('id');
        var lang = params.get('lang') || 'tr';
        var parts = [];
        if (id) parts.push('id=' + encodeURIComponent(id));
        if (lang && lang !== 'tr') parts.push('lang=' + encodeURIComponent(lang));
        var canonicalUrl = 'https://www.mete-morali.com/urun-detay' + (parts.length > 0 ? '?' + parts.join('&') : '');
        var link = document.createElement('link');
        link.rel = 'canonical';
        link.href = canonicalUrl;
        document.head.appendChild(link);
        var ogMeta = document.createElement('meta');
        ogMeta.setAttribute('property', 'og:url');
        ogMeta.setAttribute('content', canonicalUrl);
        document.head.appendChild(ogMeta);

        // Senkron Ürün SEO & Google Rich Snippets Schema (products.js üzerinden)
        var productsList = (typeof MOCK_PRODUCTS !== 'undefined') ? MOCK_PRODUCTS : (window.MOCK_PRODUCTS || []);
        var cur = id ? productsList.find(function(p) { return p.id == id; }) : (productsList.length > 0 ? productsList[0] : null);
        if (!cur && productsList.length > 0) cur = productsList[0];
        if (cur) {
            var curName = (cur.name && cur.name[lang]) || (cur.name && cur.name.tr) || (typeof cur.name === 'string' ? cur.name : '');
            var curDesc = (cur.description && cur.description[lang]) || (cur.description && cur.description.tr) || (typeof cur.description === 'string' ? cur.description : '');
            var curImg = cur.imageUrl ? ('https://www.mete-morali.com/' + cur.imageUrl) : 'https://www.mete-morali.com/img/logo_gri.webp';
            var curSku = cur.articleCode || '';
            var curPrice = cur.price || 0;

            document.title = curName + " - MeteMorali";
            var mDesc = document.querySelector('meta[name="description"]');
            if (mDesc) mDesc.setAttribute('content', curDesc);
            var ogT = document.querySelector('meta[property="og:title"]');
            if (ogT) ogT.setAttribute('content', curName + " - MeteMorali");
            var ogD = document.querySelector('meta[property="og:description"]');
            if (ogD) ogD.setAttribute('content', curDesc);
            var ogI = document.querySelector('meta[property="og:image"]');
            if (ogI) ogI.setAttribute('content', curImg);
            var twT = document.querySelector('meta[name="twitter:title"]');
            if (twT) twT.setAttribute('content', curName + " - MeteMorali");
            var twD = document.querySelector('meta[name="twitter:description"]');
            if (twD) twD.setAttribute('content', curDesc);
            var twI = document.querySelector('meta[name="twitter:image"]');
            if (twI) twI.setAttribute('content', curImg);

            var s = document.createElement('script');
            s.id = 'product-schema-ld';
            s.type = 'application/ld+json';
            s.textContent = JSON.stringify({
                "@context": "https://schema.org",
                "@type": "Product",
                "name": curName,
                "description": curDesc,
                "image": [curImg],
                "sku": curSku,
                "brand": {
                    "@type": "Brand",
                    "name": "MeteMorali"
                },
                "offers": {
                    "@type": "Offer",
                    "priceCurrency": "EUR",
                    "price": curPrice,
                    "priceValidUntil": "2027-12-31",
                    "availability": "https://schema.org/InStock",
                    "itemCondition": "https://schema.org/NewCondition",
                    "url": canonicalUrl,
                    "seller": {
                        "@type": "Organization",
                        "name": "MeteMorali"
                    }
                }
            });
            document.head.appendChild(s);
        }
    })();
    </script>

    <style>
        /* Sertifikalar ve Standartlar Bölümü */
        .standards-section-container {
            max-width: 1200px;
            margin: 50px auto 100px auto;
            padding: 50px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.02);
            font-family: 'Outfit', sans-serif;
            border: 1px solid #f0f0f4;
        }

        .standards-section-container h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 1px solid #eef0f6;
            padding-bottom: 22px;
            margin-bottom: 45px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: 'Outfit', sans-serif;
            position: relative;
            text-transform: none;
        }

        .standards-section-container h3::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 60px;
            height: 3px;
            background: #2c3e50;
            border-radius: 3px;
        }

        .standards-section-container h3 i {
            color: #2c3e50;
            font-size: 1.3rem;
        }

        .pictograms-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        @media (max-width: 1200px) {
            .pictograms-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .standard-card {
            background: #ffffff;
            border: 1px solid #eef0f6;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.01);
            height: 100%;
            box-sizing: border-box;
        }

        .standard-card:hover {
            transform: translateY(-5px);
            border-color: #cbd5e1;
            box-shadow: 0 15px 35px rgba(15,23,42,0.04);
        }

        .standard-icon-wrapper {
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .standard-card:hover .standard-icon-wrapper {
            transform: scale(1.05) rotate(-3deg);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            background: #ffffff;
            border-color: #cbd5e1;
        }

        .standard-icon-wrapper svg {
            width: 72px;
            height: 72px;
        }

        .standard-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .standard-code-badge {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #e2e8f0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        .standard-card:hover .standard-code-badge {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .standard-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
            line-height: 1.4;
            font-family: 'Outfit', sans-serif;
        }

        .standard-desc {
            font-size: 0.88rem;
            color: #64748b;
            line-height: 1.6;
            font-family: 'Outfit', sans-serif;
        }

        @media (max-width: 768px) {
            .standards-section-container {
                padding: 30px 20px;
                margin: 20px 15px 60px 15px;
                border-radius: 16px;
            }
            .pictograms-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .standard-card {
                padding: 24px;
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .standard-icon-wrapper {
                width: 70px;
                height: 70px;
            }
            .standard-icon-wrapper svg {
                width: 62px;
                height: 62px;
            }
        }
        .back-btn:hover {
            background: #e2e8f0 !important;
            color: #111 !important;
        }
    
        /* Lightbox / Zoom Modal Stilleri */
        .main-image-container {
            cursor: zoom-in;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }

        .main-image-container::after {
            content: '\f00e';
            font-family: 'Font Awesome 6 Free';
            font-weight: 900;
            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(8, 8, 12, 0.7);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            transform: scale(0.8);
            pointer-events: none;
            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: 1.1rem;
        }

        .main-image-container:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .image-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .image-lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 6, 9, 0.97);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 50px;
            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100001;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .lightbox-close:hover {
            background: #cf1b1b;
            border-color: #cf1b1b;
            transform: scale(1.05) rotate(90deg);
        }

        .lightbox-content {
            position: relative;
            width: 90%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
        }

        .lightbox-img-wrapper {
            position: relative;
            overflow: visible;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;
            max-width: 100%;
            max-height: 100%;
            touch-action: none; /* CRITICAL: Prevent browser navigation/scrolling gestures on mobile while dragging/zooming */
        }

        .lightbox-img-wrapper.dragging {
            cursor: grabbing;
        }

        .lightbox-img-wrapper img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            transform-origin: center center;
            transform: scale(1) translate(0px, 0px);
            pointer-events: none;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);
            transition: transform 0.1s cubic-bezier(0.25, 0.46, 0.45, 0.94); /* Smooth zooming/panning transitions */
        }

        .lightbox-controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            display: flex;
            gap: 15px;
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            padding: 8px 20px;
            border-radius: 40px;
            z-index: 100001;
            backdrop-filter: blur(10px);
            -webkit-backdrop-filter: blur(10px);
            box-shadow: 0 10px 30px rgba(0,0,0,0.3);
        }

        .control-btn {
            background: transparent;
            border: none;
            color: #fff;
            font-size: 1.25rem;
            cursor: pointer;
            width: 44px;
            height: 44px;
            display: flex;
            align-items: center;
            justify-content: center;
            border-radius: 50%;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            opacity: 0.8;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            opacity: 1;
            transform: scale(1.08);
        }

        /* Lightbox Gallery Navigation Buttons */
        .lightbox-nav {
            position: absolute;
            top: 50%;
            transform: translateY(-50%);
            background: rgba(255, 255, 255, 0.06);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            width: 54px;
            height: 54px;
            border-radius: 50%;
            font-size: 1.3rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100001;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .lightbox-nav:hover {
            background: rgba(255, 255, 255, 0.15);
            border-color: rgba(255, 255, 255, 0.25);
            transform: translateY(-50%) scale(1.08);
        }

        .lightbox-nav.prev {
            left: 30px;
        }

        .lightbox-nav.next {
            right: 30px;
        }

        /* Zoom Level Indicator */
        .lightbox-zoom-indicator {
            position: absolute;
            top: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: rgba(0, 0, 0, 0.7);
            border: 1px solid rgba(255, 255, 255, 0.1);
            color: #fff;
            padding: 8px 18px;
            border-radius: 20px;
            font-size: 0.9rem;
            font-weight: 600;
            font-family: 'Outfit', sans-serif;
            letter-spacing: 0.5px;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
            z-index: 100002;
            pointer-events: none;
            backdrop-filter: blur(5px);
            -webkit-backdrop-filter: blur(5px);
        }

        .lightbox-zoom-indicator.visible {
            opacity: 1;
            visibility: visible;
        }

        /* Responsive Improvements for Mobile Zoom experience */
        @media (max-width: 768px) {
            .lightbox-close {
                top: 20px;
                right: 20px;
                width: 44px;
                height: 44px;
                font-size: 1.25rem;
            }
            .lightbox-controls {
                bottom: max(20px, env(safe-area-inset-bottom, 20px));
                padding: 6px 14px;
                gap: 8px;
            }
            .control-btn {
                width: 38px;
                height: 38px;
                font-size: 1.1rem;
            }
            .lightbox-nav {
                width: 44px;
                height: 44px;
                font-size: 1.1rem;
            }
            .lightbox-nav.prev {
                left: 15px;
            }
            .lightbox-nav.next {
                right: 15px;
            }
            .lightbox-content {
                width: 100%;
                height: 100%;
            }
            .lightbox-img-wrapper img {
                max-height: 85vh;
                border-radius: 0;
                box-shadow: none;
            }
            .lightbox-zoom-indicator {
                top: 30px;
            }
        }

    </style>
</head>

        <h3><i class="fa-solid fa-shield-halved"></i> <span id="standards-title-label">Koruma Standartları & Sertifikalar</span></h3>
        <div class="pictograms-grid" id="pictograms-grid">
            
        </div>

    <div id="footer-placeholder"></div>

    <script src="js/supabase-client.js"></script>
    <script src="cart.js" defer></script>
    <script src="js/urun-detay.js" charset="utf-8" defer></script>

    
    <!-- Lightbox / Büyüteç Modal Arayüzü -->
    <div class="image-lightbox" id="image-lightbox" style="display: none;">
        <div class="lightbox-overlay" onclick="closeLightbox()"></div>
        <button class="lightbox-close" onclick="closeLightbox()" title="Kapat">
            <i class="fa-solid fa-xmark"></i>
        </button>
        <button class="lightbox-nav prev" id="lightbox-prev-btn" onclick="lightboxPrev()" title="Önceki">
            <i class="fa-solid fa-chevron-left"></i>
        </button>
        <button class="lightbox-nav next" id="lightbox-next-btn" onclick="lightboxNext()" title="Sonraki">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="lightbox-zoom-indicator" id="lightbox-zoom-indicator">1.0x</div>
        <div class="lightbox-content">
            <div class="lightbox-img-wrapper" id="lightbox-img-wrapper">
                <img id="lightbox-image" src="" alt="Büyütülmüş Ürün Resmi" draggable="false">
            </div>
        </div>
        <div class="lightbox-controls">
            <button class="control-btn" onclick="zoomImage(0.25)" title="Yakınlaştır">
                <i class="fa-solid fa-magnifying-glass-plus"></i>
            </button>
            <button class="control-btn" onclick="zoomImage(-0.25)" title="Uzaklaştır">
                <i class="fa-solid fa-magnifying-glass-minus"></i>
            </button>
            <button class="control-btn" onclick="resetZoom()" title="Sıfırla">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <div id="mobile-menu-placeholder"></div>

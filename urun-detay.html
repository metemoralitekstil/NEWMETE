    <style>
        /* Sertifikalar ve Standartlar Bölümü */
        .standards-section-container {
            max-width: 1200px;
            margin: 50px auto 100px auto;
            padding: 50px;
            background: #ffffff;
            border-radius: 20px;
            box-shadow: 0 10px 40px rgba(0,0,0,0.02);
            font-family: 'Outfit', sans-serif;
            border: 1px solid #f0f0f4;
        }

        .standards-section-container h3 {
            font-size: 1.5rem;
            font-weight: 600;
            color: #0f172a;
            border-bottom: 1px solid #eef0f6;
            padding-bottom: 22px;
            margin-bottom: 45px;
            display: flex;
            align-items: center;
            gap: 15px;
            font-family: 'Outfit', sans-serif;
            position: relative;
            text-transform: none;
        }

        .standards-section-container h3::after {
            content: '';
            position: absolute;
            bottom: -1px;
            left: 0;
            width: 60px;
            height: 3px;
            background: #2c3e50;
            border-radius: 3px;
        }

        .standards-section-container h3 i {
            color: #2c3e50;
            font-size: 1.3rem;
        }

        .pictograms-grid {
            display: grid;
            grid-template-columns: repeat(4, 1fr);
            gap: 25px;
        }

        @media (max-width: 1200px) {
            .pictograms-grid {
                grid-template-columns: repeat(2, 1fr);
            }
        }

        .standard-card {
            background: #ffffff;
            border: 1px solid #eef0f6;
            border-radius: 16px;
            padding: 24px;
            display: flex;
            flex-direction: column;
            align-items: flex-start;
            gap: 20px;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
            position: relative;
            box-shadow: 0 4px 20px rgba(0,0,0,0.01);
            height: 100%;
            box-sizing: border-box;
        }

        .standard-card:hover {
            transform: translateY(-5px);
            border-color: #cbd5e1;
            box-shadow: 0 15px 35px rgba(15,23,42,0.04);
        }

        .standard-icon-wrapper {
            flex-shrink: 0;
            width: 80px;
            height: 80px;
            display: flex;
            justify-content: center;
            align-items: center;
            background: #f8fafc;
            border-radius: 12px;
            border: 1px solid #e2e8f0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .standard-card:hover .standard-icon-wrapper {
            transform: scale(1.05) rotate(-3deg);
            box-shadow: 0 8px 20px rgba(0,0,0,0.04);
            background: #ffffff;
            border-color: #cbd5e1;
        }

        .standard-icon-wrapper svg {
            width: 72px;
            height: 72px;
        }

        .standard-info {
            display: flex;
            flex-direction: column;
            text-align: left;
        }

        .standard-code-badge {
            align-self: flex-start;
            font-size: 0.75rem;
            font-weight: 700;
            color: #475569;
            background: #f1f5f9;
            padding: 4px 10px;
            border-radius: 6px;
            margin-bottom: 10px;
            text-transform: uppercase;
            letter-spacing: 0.5px;
            border: 1px solid #e2e8f0;
            font-family: 'Outfit', sans-serif;
            transition: all 0.3s ease;
        }

        .standard-card:hover .standard-code-badge {
            background: #0f172a;
            color: #ffffff;
            border-color: #0f172a;
        }

        .standard-name {
            font-size: 1.1rem;
            font-weight: 600;
            color: #0f172a;
            margin-bottom: 8px;
            line-height: 1.4;
            font-family: 'Outfit', sans-serif;
        }

        .standard-desc {
            font-size: 0.88rem;
            color: #64748b;
            line-height: 1.6;
            font-family: 'Outfit', sans-serif;
        }

            .standards-section-container {
                padding: 30px 20px;
                margin: 20px 15px 60px 15px;
                border-radius: 16px;
            }
            .pictograms-grid {
                grid-template-columns: 1fr;
                gap: 20px;
            }
            .standard-card {
                padding: 24px;
                flex-direction: column;
                align-items: flex-start;
                gap: 15px;
            }
            .standard-icon-wrapper {
                width: 70px;
                height: 70px;
            }

        }

            background: #e2e8f0 !important;
            color: #111 !important;
        }
    
        /* Lightbox / Zoom Modal Stilleri */
        .main-image-container {
            cursor: zoom-in;
            position: relative;
            overflow: hidden;
            border-radius: 12px;
        }

        .main-image-container::after {
            content: '\f00e';

            position: absolute;
            top: 20px;
            right: 20px;
            background: rgba(8, 8, 12, 0.7);
            color: #fff;
            width: 44px;
            height: 44px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);

            border: 1px solid rgba(255, 255, 255, 0.1);
            box-shadow: 0 4px 15px rgba(0, 0, 0, 0.2);
            font-size: 1.1rem;
        }

        .main-image-container:hover::after {
            opacity: 1;
            transform: scale(1);
        }

        .image-lightbox {
            position: fixed;
            top: 0;
            left: 0;
            width: 100vw;
            height: 100vh;
            z-index: 99999;
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 0;
            visibility: hidden;
            transition: opacity 0.3s ease, visibility 0.3s ease;
        }

        .image-lightbox.active {
            opacity: 1;
            visibility: visible;
        }

        .lightbox-overlay {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(6, 6, 9, 0.97);
        }

        .lightbox-close {
            position: absolute;
            top: 30px;
            right: 30px;

            height: 50px;
            border-radius: 50%;
            font-size: 1.5rem;
            cursor: pointer;
            display: flex;
            align-items: center;
            justify-content: center;
            transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1);
            z-index: 100001;
            backdrop-filter: blur(8px);
            -webkit-backdrop-filter: blur(8px);
        }

        .lightbox-close:hover {
            background: #cf1b1b;
            border-color: #cf1b1b;
            transform: scale(1.05) rotate(90deg);
        }

        .lightbox-content {
            position: relative;
            width: 90%;
            height: 80%;
            display: flex;
            align-items: center;
            justify-content: center;
            z-index: 100000;
        }

        .lightbox-img-wrapper {
            position: relative;
            overflow: visible;
            cursor: grab;
            display: flex;
            align-items: center;
            justify-content: center;
            user-select: none;

            max-height: 100%;

        }

        .lightbox-img-wrapper.dragging {
            cursor: grabbing;
        }

        .lightbox-img-wrapper img {
            max-width: 100%;
            max-height: 80vh;
            object-fit: contain;
            transform-origin: center center;
            transform: scale(1) translate(0px, 0px);
            pointer-events: none;
            box-shadow: 0 25px 60px rgba(0, 0, 0, 0.6);
            border-radius: 12px;
            border: 1px solid rgba(255, 255, 255, 0.05);

        }

        .lightbox-controls {
            position: absolute;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);

            gap: 15px;

        }

            background: transparent;

            height: 44px;

            border-radius: 50%;

            opacity: 0.8;
        }

        .control-btn:hover {
            background: rgba(255, 255, 255, 0.12);
            opacity: 1;
            transform: scale(1.08);
        }

        .lightbox-nav {

    <script>
        let currentProductData = null;

        function updateQty(change) {
            const input = document.getElementById('qty-input');
            let val = parseInt(input.value) + change;
            if (val < 1) val = 1;
            input.value = val;
        }

        function getColorCssValue(colorName) {
            const name = colorName.trim().toLowerCase();
            const colorMap = {
                'mavi': '#1e3799',
                'lacivert': '#0c2461',
                'sarı': '#f1c40f',
                'turuncu': '#e67e22',
                'gri': '#7f8c8d',
                'siyah': '#1e272e',
                'kırmızı': '#cf1b1b',
                'yeşil': '#27ae60',
                'beyaz': '#ffffff',
                'saks': '#2980b9'
            };

            if (colorMap[name]) return colorMap[name];

            if (name.includes('/')) {
                const parts = name.split('/');
                const color1 = colorMap[parts[0].trim()] || '#ccc';
                const color2 = colorMap[parts[1].trim()] || '#ccc';
                
                // Kışlık Parka (ID 1) ve Supervisor Takım (ID 2) için sarı/mavi veya sarı/lacivert oranını %70'e %30 yap
                if (currentProductData && 
                    (currentProductData.id == 1 || currentProductData.id == 2 ||
                     (currentProductData.name && typeof currentProductData.name === 'string' && (currentProductData.name.toLowerCase().includes('parka') || currentProductData.name.toLowerCase().includes('supervisor'))) ||
                     (currentProductData.name && typeof currentProductData.name === 'object' && currentProductData.name.tr && (currentProductData.name.tr.toLowerCase().includes('parka') || currentProductData.name.tr.toLowerCase().includes('supervisor'))))
                ) {
                    if (parts[0].trim() === 'sarı' && (parts[1].trim() === 'lacivert' || parts[1].trim() === 'mavi')) {
                        return `linear-gradient(135deg, ${color1} 70%, ${color2} 70%)`;
                    }
                }
                
                // Hi-Vis Kaynakçı (ID 3 ve 7) için mavi/sarı oranını %65'e %35 yap
                if (currentProductData && 
                    (currentProductData.id == 3 || currentProductData.id == 7 ||
                     (currentProductData.name && typeof currentProductData.name === 'string' && currentProductData.name.toLowerCase().includes('kaynakçı')) ||
                     (currentProductData.name && typeof currentProductData.name === 'object' && currentProductData.name.tr && currentProductData.name.tr.toLowerCase().includes('kaynakçı')))
                ) {
                    if (parts[0].trim() === 'mavi' && parts[1].trim() === 'sarı') {
                        return `linear-gradient(135deg, ${color1} 65%, ${color2} 65%)`;
                    }
                }
                
                return `linear-gradient(135deg, ${color1} 50%, ${color2} 50%)`;
            }

            return '#cccccc';
        }

        function addToCartAnimation() {
            if (!currentProductData) return;

            const activeSizeBtn = document.querySelector('.size-btn.active');
            const size = activeSizeBtn ? activeSizeBtn.textContent : 'Standart';
            const activeColorBtn = document.querySelector('.color-btn.active');
            const color = activeColorBtn ? activeColorBtn.getAttribute('data-color') : '';
            const qtyInput = document.getElementById('qty-input');
            const quantity = qtyInput ? parseInt(qtyInput.value) : 1;

            addToCart({
                id: currentProductData.id.toString(),
                title: currentProductData.name,
                image: currentProductData.imageUrl,
                size: size,
                color: color,
                quantity: quantity,
                price: currentProductData.price
            });
        }

        function changeMainImage(src, element) {
            document.getElementById('main-image').style.opacity = 0;
            setTimeout(() => {
                document.getElementById('main-image').src = src;
                document.getElementById('main-image').style.opacity = 1;
            }, 150);

            // Thumbnail aktif classını güncelle
            document.querySelectorAll('.thumbnail').forEach(t => t.classList.remove('active'));
            if(element) element.classList.add('active');
        }

            const urlParams = new URLSearchParams(window.location.search);
            const productId = urlParams.get('id');

            if (!productId) {
                document.getElementById('loading-container').innerHTML = '<h2 style="width: 100%; text-align: center; color: red;">Ürün bulunamadı!</h2>';

                                        description: data.Description || data.description,
                                        price: Number(data.Price || data.price),
                                        imageUrl: data.ImageUrl || data.image_url || data.imageUrl,
                                        subImages: data.SubImages || data.sub_images || data.subImages,
                                        articleCode: data.ArticleCode || data.article_code || data.articleCode,
                                                                        standards: data.Standards || data.standards,
                                        colors: data.Colors || data.colors,
                                        features: data.Features || data.features,
                                        stockQuantity: (data.StockQuantity !== undefined ? data.StockQuantity : (data.stockQuantity !== undefined ? data.stockQuantity : (data.stock_quantity !== undefined ? data.stock_quantity : 100)))
                                    };
                                }
                            } else {
                                const idVal = parseInt(productId);
                                if (!isNaN(idVal)) {
                                    const { data, error } = await supabaseClient.from('Products').select('*').eq('Id', idVal).maybeSingle();
                                    if (data) {
                                        product = {
                                            id: data.Id || data.id,
                                            name: data.Name || data.name,
                                            subtitle: data.Subtitle || data.subtitle,
                                            description: data.Description || data.description,
                                            price: Number(data.Price || data.price),
                                            imageUrl: data.ImageUrl || data.image_url || data.imageUrl,
                                            subImages: data.SubImages || data.sub_images || data.subImages,
                                            articleCode: data.ArticleCode || data.article_code || data.articleCode,
                                            certificateCode: data.CertificateCode || data.certificate_code || data.certificateCode,
                                            standards: data.Standards || data.standards,
                                            colors: data.Colors || data.colors,
                                            features: data.Features || data.features,
                                            stockQuantity: (data.StockQuantity !== undefined ? data.StockQuantity : (data.stockQuantity !== undefined ? data.stockQuantity : (data.stock_quantity !== undefined ? data.stock_quantity : 100)))
                                        };
                                    }
                                }
                            }
                        } catch (err) {
                            console.warn("Supabase'den ürün detayı çekilemedi.", err);
                        }
                    }

                    if (!product) {
                        const apiBase = (typeof SITE_CONFIG !== 'undefined' ? SITE_CONFIG.apiBase : 'http://localhost:5055');
                        if (mockProduct) {
                            const response = await fetch(`${apiBase}/api/Products`);
                            if (response.ok) {
                                const apiProducts = await response.json();
                                product = apiProducts.find(p => p.articleCode === mockProduct.articleCode);
                            }
                        } else {
                            const response = await fetch(`${apiBase}/api/Products/${productId}`);
                            if (response.ok) {
                                product = await response.json();
                            }
                        }
                    }
                } catch (e) {
                    console.warn("Veritabanı bağlantısı kurulamadı, fallback olarak mock veriler kullanılacak.", e);

        // --- Lightbox / Büyüteç Modal İşlevleri ---
        let zoomScale = 1;
        let isDragging = false;
        let startX, startY;
        let translateX = 0, translateY = 0;
        let currentTranslateX = 0, currentTranslateY = 0;
        let tpDistStart = 0;
        let tpZoomStart = 1;
        
        let lightboxImages = [];
        let currentLightboxIndex = 0;
        
        let lastTap = 0;
        let swipeStartX = 0;
        let swipeStartY = 0;
        let isSwipeRegistered = false;
        let indicatorTimeout;

        function showZoomIndicator() {
            const indicator = document.getElementById('lightbox-zoom-indicator');
            if (indicator) {
                indicator.textContent = `${zoomScale.toFixed(1)}x`;
                indicator.classList.add('visible');
                clearTimeout(indicatorTimeout);
                indicatorTimeout = setTimeout(() => {
                    indicator.classList.remove('visible');
                }, 1500);
            }
        }

        function updateLightboxNavigation() {
            const prevBtn = document.getElementById('lightbox-prev-btn');
            const nextBtn = document.getElementById('lightbox-next-btn');
            if (prevBtn && nextBtn) {
                prevBtn.style.display = currentLightboxIndex > 0 ? 'flex' : 'none';
                nextBtn.style.display = currentLightboxIndex < lightboxImages.length - 1 ? 'flex' : 'none';
            }
        }

        function lightboxPrev() {
            if (currentLightboxIndex > 0) {
                currentLightboxIndex--;
                updateLightboxImage();
            }
        }

        function lightboxNext() {
            if (currentLightboxIndex < lightboxImages.length - 1) {
                currentLightboxIndex++;
                updateLightboxImage();
            }
        }

        function updateLightboxImage() {
            const lightboxImg = document.getElementById('lightbox-image');
            if (lightboxImg && lightboxImages[currentLightboxIndex]) {
                lightboxImg.style.opacity = 0;
                setTimeout(() => {
                    lightboxImg.src = lightboxImages[currentLightboxIndex];
                    lightboxImg.style.opacity = 1;
                    resetZoom();
                    updateLightboxNavigation();
                }, 150);
            }
        }

        function openLightbox() {
            const mainImg = document.getElementById('main-image');
            const lightbox = document.getElementById('image-lightbox');
            const lightboxImg = document.getElementById('lightbox-image');
            
            if (!mainImg || !lightbox || !lightboxImg) return;
            
            // Sync lightbox image list and current index
            const currentSrc = mainImg.getAttribute('src');
            currentLightboxIndex = lightboxImages.indexOf(currentSrc);
            if (currentLightboxIndex === -1) {
                currentLightboxIndex = 0;
            }
            
            lightboxImg.src = mainImg.src;
            lightbox.style.display = 'flex';
            
            setTimeout(() => {
                lightbox.classList.add('active');
                document.body.style.overflow = 'hidden';
            }, 10);
            
            resetZoom();
            updateLightboxNavigation();
        }

        function closeLightbox() {
            const lightbox = document.getElementById('image-lightbox');
            if (!lightbox) return;
            
            lightbox.classList.remove('active');
            document.body.style.overflow = '';
            
            setTimeout(() => {
                lightbox.style.display = 'none';
                ticking = false;
            }, 300);
        }

        let ticking = false;
        function updateImageTransform() {
            if (!ticking) {
                requestAnimationFrame(() => {
                    const img = document.getElementById('lightbox-image');
                    if (img) {
                        img.style.transform = `scale(${zoomScale}) translate(${translateX / zoomScale}px, ${translateY / zoomScale}px)`;
                    }
                    ticking = false;
                });
                ticking = true;
            }
        }

        function clampTransitions() {
            const img = document.getElementById('lightbox-image');
            if (!img) return;

            const viewportWidth = window.innerWidth;
            const viewportHeight = window.innerHeight;

            const rect = img.getBoundingClientRect();
            
            // Image dimensions at scale 1
            const widthAtScale1 = rect.width / zoomScale;
            const heightAtScale1 = rect.height / zoomScale;

            const zoomedWidth = widthAtScale1 * zoomScale;
            const zoomedHeight = heightAtScale1 * zoomScale;

            let maxTx = 0;
            if (zoomedWidth > viewportWidth) {
                maxTx = (zoomedWidth - viewportWidth) / 2;
            }
            
            let maxTy = 0;
            if (zoomedHeight > viewportHeight) {
                maxTy = (zoomedHeight - viewportHeight) / 2;
            }

            translateX = Math.min(Math.max(translateX, -maxTx), maxTx);
            translateY = Math.min(Math.max(translateY, -maxTy), maxTy);
        }

        function zoomImage(amount) {
            const oldZoomScale = zoomScale;
            zoomScale += amount;
            if (zoomScale < 1) zoomScale = 1;
            if (zoomScale > 6) zoomScale = 6;
            
            if (zoomScale <= 1) {
                translateX = 0;
                translateY = 0;
                currentTranslateX = 0;
                currentTranslateY = 0;
            } else {
                // Adjust translate to keep zooming centered
                const ratio = zoomScale / oldZoomScale;
                translateX = translateX * ratio;
                translateY = translateY * ratio;
                clampTransitions();
                currentTranslateX = translateX;
                currentTranslateY = translateY;
            }
            updateImageTransform();
            showZoomIndicator();
        }

        function resetZoom() {
            zoomScale = 1;
            translateX = 0;
            translateY = 0;
            currentTranslateX = 0;
            currentTranslateY = 0;
            updateImageTransform();
            showZoomIndicator();
        }

        // Double-tap zoom logic centered at tap location
        function handleDoubleTap(e) {
            const img = document.getElementById('lightbox-image');
            if (!img) return;

            if (zoomScale > 1) {
                resetZoom();
            } else {
                zoomScale = 2.5;
                
                const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                
                const rect = img.getBoundingClientRect();
                const imgCenterX = rect.left + rect.width / 2;
                const imgCenterY = rect.top + rect.height / 2;
                
                // Calculate translation to focus on tapped point
                translateX = (clientX - imgCenterX) * (1 - zoomScale);
                translateY = (clientY - imgCenterY) * (1 - zoomScale);
                
                clampTransitions();
                currentTranslateX = translateX;
                currentTranslateY = translateY;
                
                updateImageTransform();
                showZoomIndicator();
            }
        }

        // Initialize Lightbox Events
        document.addEventListener('DOMContentLoaded', () => {
            const lightbox = document.getElementById('image-lightbox');
            const wrapper = document.getElementById('lightbox-img-wrapper');
            const mainImg = document.getElementById('main-image');
            
            if (mainImg) {
                mainImg.parentElement.addEventListener('click', openLightbox);
            }
            
            if (lightbox) {
                document.addEventListener('keydown', (e) => {
                    if (lightbox.classList.contains('active')) {
                        if (e.key === 'Escape') {
                            closeLightbox();
                        } else if (e.key === 'ArrowLeft') {
                            lightboxPrev();
                        } else if (e.key === 'ArrowRight') {
                            lightboxNext();
                        }
                    }
                });

                lightbox.addEventListener('wheel', (e) => {
                    e.preventDefault();
                    const delta = e.deltaY < 0 ? 0.25 : -0.25;
                    zoomImage(delta);
                }, { passive: false });
            }

            if (wrapper) {
                const startDrag = (e) => {
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;

                    if (zoomScale <= 1) {
                        // Register swipe gesture on 1x scale
                        swipeStartX = clientX;
                        swipeStartY = clientY;
                        isSwipeRegistered = true;
                        return;
                    }
                    
                    if (e.touches && e.touches.length > 1) return;
                    
                    isDragging = true;
                    wrapper.classList.add('dragging');
                    
                    startX = clientX - currentTranslateX;
                    startY = clientY - currentTranslateY;
                };

                const doDrag = (e) => {
                    if (zoomScale <= 1) return;
                    if (!isDragging) return;
                    if (e.touches && e.touches.length > 1) return;
                    e.preventDefault();
                    
                    const clientX = e.touches ? e.touches[0].clientX : e.clientX;
                    const clientY = e.touches ? e.touches[0].clientY : e.clientY;
                    
                    translateX = clientX - startX;
                    translateY = clientY - startY;
                    
                    clampTransitions();
                    updateImageTransform();
                };

                const stopDrag = (e) => {
                    if (isSwipeRegistered && zoomScale <= 1) {
                        const clientX = e.changedTouches ? e.changedTouches[0].clientX : e.clientX;
                        const clientY = e.changedTouches ? e.changedTouches[0].clientY : e.clientY;
                        
                        const deltaX = clientX - swipeStartX;
                        const deltaY = clientY - swipeStartY;
                        
                        // Swipe threshold
                        if (Math.abs(deltaX) > 60 && Math.abs(deltaY) < 45) {
                            if (deltaX > 0) {
                                lightboxPrev();
                            } else {
                                lightboxNext();
                            }
                        }
                    }
                    isSwipeRegistered = false;

                    if (!isDragging) return;
                    isDragging = false;
                    wrapper.classList.remove('dragging');
                    currentTranslateX = translateX;
                    currentTranslateY = translateY;
                };

                wrapper.addEventListener('mousedown', startDrag);
                wrapper.addEventListener('mousemove', doDrag);
                document.addEventListener('mouseup', stopDrag);
                wrapper.addEventListener('mouseleave', stopDrag);

                // Touch double-tap and swipe/drag init
                wrapper.addEventListener('touchstart', (e) => {
                    if (e.touches.length === 1) {
                        const currentTime = new Date().getTime();
                        const tapLength = currentTime - lastTap;
                        if (tapLength < 300 && tapLength > 0) {
                            e.preventDefault(); // Prevent double tap zoom default action in Safari
                            handleDoubleTap(e);
                        }
                        lastTap = currentTime;
                    }
                    
                    if (e.touches.length !== 2) {
                        tpDistStart = 0;
                    }
                    startDrag(e);
                }, { passive: false });
                
                wrapper.addEventListener('touchmove', (e) => {
                    if (zoomScale > 1) {
                        doDrag(e);
                    }
                }, { passive: false });
                
                wrapper.addEventListener('touchend', stopDrag);

                // Touch pinch-to-zoom with midpoint centering
                wrapper.addEventListener('touchmove', (e) => {
                    if (e.touches.length === 2) {
                        e.preventDefault();
                        
                        const touch1 = e.touches[0];
                        const touch2 = e.touches[1];
                        
                        const dist = Math.hypot(
                            touch1.clientX - touch2.clientX,
                            touch1.clientY - touch2.clientY
                        );
                        const midX = (touch1.clientX + touch2.clientX) / 2;
                        const midY = (touch1.clientY + touch2.clientY) / 2;

                        if (tpDistStart === 0) {
                            tpDistStart = dist;
                            tpZoomStart = zoomScale;
                        } else {
                            const factor = dist / tpDistStart;
                            const newZoomScale = Math.min(Math.max(tpZoomStart * factor, 1), 6);
                            
                            if (newZoomScale !== zoomScale) {
                                // Adjust translation so the midpoint is maintained relative to current zoom origin
                                const ratio = newZoomScale / zoomScale;
                                translateX = midX - (midX - translateX) * ratio;
                                translateY = midY - (midY - translateY) * ratio;
                                
                                zoomScale = newZoomScale;
                                
                                clampTransitions();
                                updateImageTransform();
                            }
                        }
                    }
                }, { passive: false });

                wrapper.addEventListener('touchend', (e) => {
                    if (e.touches.length < 2) {
                        tpDistStart = 0;
                        currentTranslateX = translateX;
                        currentTranslateY = translateY;
                    }
                });
            }
        });

        document.addEventListener('DOMContentLoaded', loadProductDetail);

        </button>
        <button class="lightbox-nav next" id="lightbox-next-btn" onclick="lightboxNext()" title="Sonraki">
            <i class="fa-solid fa-chevron-right"></i>
        </button>
        <div class="lightbox-zoom-indicator" id="lightbox-zoom-indicator">1.0x</div>
        <div class="lightbox-content">
            <div class="lightbox-img-wrapper" id="lightbox-img-wrapper">
                <img id="lightbox-image" src="" alt="Büyütülmüş Ürün Resmi" draggable="false">
            </div>
        </div>
        <div class="lightbox-controls">
            <button class="control-btn" onclick="zoomImage(0.25)" title="Yakınlaştır">
                <i class="fa-solid fa-magnifying-glass-plus"></i>
            </button>
            <button class="control-btn" onclick="zoomImage(-0.25)" title="Uzaklaştır">
                <i class="fa-solid fa-magnifying-glass-minus"></i>
            </button>
            <button class="control-btn" onclick="resetZoom()" title="Sıfırla">
                <i class="fa-solid fa-rotate-right"></i>
            </button>
        </div>
    </div>

    <div id="mobile-menu-placeholder"></div>

    <script src="https://cdnjs.cloudflare.com/ajax/libs/gsap/3.12.2/gsap.min.js" defer></script>
    <script src="components/loader.js" defer></script>
    <script src="js/components.js" defer></script>
</body>
</html>

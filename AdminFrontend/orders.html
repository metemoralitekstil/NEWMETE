<!DOCTYPE html>
<html lang="tr">
<head>
    <!-- Google tag (gtag.js) -->
    <script async src="https://www.googletagmanager.com/gtag/js?id=G-88R5628V9H"></script>
    <script>
      window.dataLayer = window.dataLayer || [];
      function gtag(){dataLayer.push(arguments);}
      gtag('js', new Date());
      gtag('config', 'G-88R5628V9H');
    </script>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MeteMorali Admin | Sipariş Yönetimi</title>

    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700;800&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    
    <link rel="stylesheet" href="css/admin-style.css">
</head>
<body>
    <div class="admin-layout">
        <!-- Sidebar Navigation -->
        <aside class="sidebar">
            <div>
                <div class="brand-section">
                    <div class="brand-logo">
                        <img src="../img/logo_gri.webp" alt="MeteMorali" onerror="this.src='../img/logo_gri.png'">
                    </div>
                    <div class="brand-text">
                        <h2>MeteMorali</h2>
                        <span>Admin Suite</span>
                    </div>
                </div>

                <nav class="sidebar-nav">
                    <div class="nav-label">Yönetim Paneli</div>
                    <a href="dashboard.html">
                        <i class="fa-solid fa-chart-line"></i>
                        <span>Dashboard</span>
                    </a>
                    <a href="products.html">
                        <i class="fa-solid fa-boxes-stacked"></i>
                        <span>Ürün Yönetimi</span>
                    </a>
                    <a href="orders.html" class="active">
                        <i class="fa-solid fa-bag-shopping"></i>
                        <span>Sipariş Yönetimi</span>
                    </a>
                    <a href="customers.html">
                        <i class="fa-solid fa-users"></i>
                        <span>Kayıtlı Müşteriler</span>
                    </a>

                    <div class="nav-label">Sistem & Vitrin</div>
                    <a href="seo-analiz.html">
                        <i class="fa-solid fa-magnifying-glass-chart"></i>
                        <span>SEO Analiz</span>
                    </a>
                    <a href="../katalog.html" target="_blank">
                        <i class="fa-solid fa-arrow-up-right-from-square"></i>
                        <span>Canlı Mağazayı Aç</span>
                    </a>
                </nav>
            </div>

            <div class="sidebar-footer">
                <a href="#" onclick="confirmLogout(event)" class="logout-btn">
                    <i class="fa-solid fa-arrow-right-from-bracket"></i>
                    <span>Çıkış Yap</span>
                </a>
            </div>
        </aside>

        <!-- Main Content Area -->
        <main class="main-content">
            <header class="top-bar">
                <div class="page-title">
                    <h1>Sipariş Yönetimi</h1>
                </div>
                <div class="top-actions">
                    <button class="btn btn-secondary btn-sm" onclick="loadOrders();">
                        <i class="fa-solid fa-rotate"></i> Yenile
                    </button>
                </div>
            </header>

            <!-- Table Container -->
            <div class="table-container">
                <table id="ordersTable" class="data-table">
                    <thead>
                        <tr>
                            <th style="width: 90px;">Sipariş No</th>
                            <th>Müşteri Bilgisi</th>
                            <th>Sipariş Tarihi</th>
                            <th>Toplam Tutar</th>
                            <th style="width: 170px;">Durum Değiştir</th>
                            <th style="width: 110px;">İşlem</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td colspan="6" style="text-align: center; color: var(--text-muted); padding: 40px;">
                                <i class="fa-solid fa-spinner fa-spin" style="margin-right: 8px;"></i> Siparişler yükleniyor...
                            </td>
                        </tr>
                    </tbody>
                </table>
            </div>
        </main>
    </div>

    <!-- Scripts -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            if (typeof loadOrders === 'function') loadOrders();

            // 15 saniyede bir otomatik yenile
            setInterval(() => {
                if (typeof loadOrders === 'function') loadOrders();
            }, 15000);
        });
    </script>
</body>
</html>

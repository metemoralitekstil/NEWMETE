    <meta charset="UTF-8">
    <title>Admin Dashboard</title>
    <link rel="stylesheet" href="css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <div class="admin-layout">
        <div class="sidebar">
            <div class="sidebar-menu">
                <h3>Admin Panel</h3>
                <ul>
                    <li><a href="dashboard.html" class="active">Dashboard</a></li>
                    <li><a href="products.html">Ürün Yönetimi</a></li>
                    <li><a href="orders.html">Sipariş Yönetimi</a></li>
                    <li><a href="customers.html">Kayıtlı Müşteriler</a></li>
                    <li><a href="seo-analiz.html">SEO Analiz</a></li>
                </ul>
            </div>
            <div class="logout-container">
                <a href="#" onclick="confirmLogout(event)" class="logout-btn">Çıkış Yap <i class="fa-solid fa-door-open"></i></a>
            </div>
        </div>
        <div class="main-content">
            <div class="header">
                <h2>Dashboard Özeti</h2>
            </div>
            <div class="card-container">
                <div class="card">
                    <h4>Toplam Ürün</h4>
                    <h2 id="totalProducts">-</h2>
                </div>
                <div class="card">
                    <h4>Stok Miktarı</h4>
                    <h2 id="totalStock">-</h2>
                </div>
                <div class="card">
                    <h4>Toplam Sipariş</h4>
                    <h2 id="totalOrders">-</h2>
                </div>
                <div class="card">
                    <h4>Toplam Gelir</h4>
                    <h2 id="totalRevenue">-</h2>
                </div>
            </div>
            <h3>Son Siparişler</h3>
            <table id="recentOrdersTable">
                <thead>
                    <tr>
                        <th>Sipariş No</th>
                        <th>Müşteri</th>
                        <th>Tarih</th>
                        <th>Tutar</th>
                        <th>Durum</th>
                    </tr>
                </thead>
                <tbody>
                </tbody>
            </table>
        </div>
    </div>
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        document.addEventListener('DOMContentLoaded', () => {
            loadDashboard();
            // Her 10 saniyede bir dashboard verilerini otomatik yenile
            setInterval(loadDashboard, 10000);
        });
    </script>
</body>
</html>

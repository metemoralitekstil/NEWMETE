<!DOCTYPE html>
<html lang="tr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="robots" content="noindex, nofollow, noarchive, nosnippet">
    <title>Yönetici Girişi — MeteMorali</title>
    
    <!-- Fonts -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@400;500;600;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="css/admin-style.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
    <link rel="icon" type="image/webp" href="../img/logo_gri.webp">
</head>
<body class="login-body">

    <div class="login-card">
        <div class="login-header">
            <div class="login-brand">
                <img src="../img/logo_gri.webp" alt="MeteMorali" class="login-brand-logo" onerror="this.src='../img/logo_gri.png'">
                <div>
                    <h2>MeteMorali</h2>
                    <span>Admin Portalı</span>
                </div>
            </div>
            <p class="login-subtitle">Lütfen yetkili kullanıcı bilgilerinizi giriniz</p>
        </div>

        <!-- Bot & Brute-Force Kilit Bildirimi -->
        <div id="lockoutBanner" class="lockout-banner" style="border-radius: 4px;">
            <i class="fa-solid fa-lock" style="margin-right: 6px;"></i>
            Çok fazla hatalı deneme! Lütfen <strong id="lockoutTimer">300</strong> saniye bekleyin.
        </div>

        <div id="errorBanner" class="error-banner" style="border-radius: 4px;">
            <i class="fa-solid fa-circle-exclamation" style="margin-right: 6px;"></i>
            <span id="errorMsg">Hatalı kullanıcı adı veya şifre!</span>
        </div>

        <form id="loginForm" autocomplete="off">
            <!-- Honeypot Bot Kapanı (Görünmez tuzak alanı) -->
            <input type="text" id="b_trap_field" name="b_trap_field" style="position: absolute; left: -9999px; opacity: 0; pointer-events: none;" tabindex="-1" autocomplete="off">

            <div class="form-group">
                <label for="username">Kullanıcı Adı</label>
                <input type="text" id="username" class="form-input" placeholder="admin" required autofocus autocomplete="username">
            </div>

            <div class="form-group">
                <label for="password">Şifre</label>
                <div class="password-wrapper">
                    <input type="password" id="password" class="form-input" placeholder="••••••••" required autocomplete="current-password">
                    <button type="button" class="password-toggle-btn" id="togglePasswordBtn" title="Şifreyi Göster/Gizle">
                        <i class="fa-regular fa-eye" id="togglePasswordIcon"></i>
                    </button>
                </div>
            </div>

            <button type="submit" class="btn btn-primary" id="loginSubmitBtn" style="width: 100%; margin-top: 10px; padding: 13px; border-radius: 4px;">
                <span id="btnText">Giriş Yap</span>
                <i class="fa-solid fa-arrow-right" id="btnIcon"></i>
            </button>
        </form>
    </div>

    <!-- Toast Notification Container -->
    <div id="adminToastContainer"></div>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
    <script src="js/supabase-client.js"></script>
    <script src="js/auth.js"></script>
    <script src="js/api.js"></script>
    <script>
        // Password Visibility Toggle
        const toggleBtn = document.getElementById('togglePasswordBtn');
        const passwordInput = document.getElementById('password');
        const toggleIcon = document.getElementById('togglePasswordIcon');

        if (toggleBtn && passwordInput) {
            toggleBtn.addEventListener('click', () => {
                const isPassword = passwordInput.getAttribute('type') === 'password';
                passwordInput.setAttribute('type', isPassword ? 'text' : 'password');
                toggleIcon.className = isPassword ? 'fa-regular fa-eye-slash' : 'fa-regular fa-eye';
            });
        }
    </script>
</body>
</html>
